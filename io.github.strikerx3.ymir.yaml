app-id: io.github.strikerx3.ymir
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
command: ymir-sdl3
rename-icon: ymir
finish-args:
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=x11
  - --device=all
  # Grant access to external media (for example, Steam Deck)
  - --filesystem=/media:ro
  - --filesystem=/mnt:ro
  - --filesystem=/run/media:ro
modules:
  - name: cereal
    buildsystem: cmake
    config-opts:
      - -D CMAKE_C_COMPILER=gcc
      - -D CMAKE_CXX_COMPILER=g++
      - -D SKIP_PERFORMANCE_COMPARISON=ON
      - -D SKIP_PORTABILITY_TEST=ON
    sources:
      - type: git
        url: https://github.com/USCiLab/cereal.git
        commit: a56bad8bbb770ee266e930c95d37fff2a5be7fea
  - name: cxxopts
    buildsystem: cmake
    sources:
      - type: git
        url: https://github.com/jarro2783/cxxopts.git
        tag: v3.3.1
        commit: 44380e5a44706ab7347f400698c703eb2a196202
  - name: date
    buildsystem: cmake
    build-options:
      append-path: /usr/lib/sdk/llvm21/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
    config-opts:
      - -D CMAKE_C_COMPILER=clang
      - -D CMAKE_CXX_COMPILER=clang++
      - -D CMAKE_BUILD_TYPE=Release
      - -D ENABLE_DATE_TESTING=ON
      - -D BUILD_TZ_LIB=ON
    sources:
      - type: git
        url: https://github.com/HowardHinnant/date.git
        commit: 179a6b921ccd6179b5b04dce812a89f71a51b4df
  - name: rtmidi
    buildsystem: cmake
    build-options:
      append-path: /usr/lib/sdk/llvm21/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
    config-opts:
      - -D CMAKE_C_COMPILER=clang
      - -D CMAKE_CXX_COMPILER=clang++
      - -D CMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/thestk/rtmidi.git
        tag: 6.1.0
        commit: 7e31b5bfcc9350058fbaf81d62a8eb39dd29c5f7
  - name: stb
    buildsystem: cmake
    sources:
      - type: git
        url: https://github.com/Citrodata/stb-cmake.git
        commit: 489e513486c7ad8e84b77e8c34fcc56d81080ebf
    post-install:
      - install -Dm644 ${FLATPAK_DEST}/include/stb/*.h ${FLATPAK_DEST}/include/
  - name: tomlplusplus
    buildsystem: cmake
    build-options:
      append-path: /usr/lib/sdk/llvm21/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
    config-opts:
      - -D CMAKE_C_COMPILER=clang
      - -D CMAKE_CXX_COMPILER=clang++
      - -D CMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/marzer/tomlplusplus.git
        tag: v3.4.0
        commit: 30172438cee64926dc41fdd9c11fb3ba5b2ba9de
  - name: Catch2
    buildsystem: cmake
    build-options:
      append-path: /usr/lib/sdk/llvm21/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
    builddir: true
    config-opts:
      - -D CMAKE_C_COMPILER=clang
      - -D CMAKE_CXX_COMPILER=clang++
      - -D CMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/catchorg/Catch2.git
        tag: v3.16.1
        commit: 08092139210881f01a34e60c5f2fd6afa0ea4024
  - name: curl
    buildsystem: cmake
    build-options:
      append-path: /usr/lib/sdk/llvm21/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
    config-opts:
      - -D CMAKE_C_COMPILER=clang
      - -D CMAKE_CXX_COMPILER=clang++
      - -D CMAKE_BUILD_TYPE=Release
      - -D BUILD_SHARED_LIBS=OFF
    sources:
      - type: git
        url: https://github.com/curl/curl.git
        tag: curl-8_23_0
        commit: 3163ec065643ba20709f190111f42c3e1fe95273
  - name: semver
    buildsystem: cmake
    build-options:
      append-path: /usr/lib/sdk/llvm21/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
    config-opts:
      - -D CMAKE_C_COMPILER=clang
      - -D CMAKE_CXX_COMPILER=clang++
      - -D CMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/Neargye/semver.git
        tag: v1.0.1
        commit: b8cc461e73a418cb511861c7be7da84eadf4b2b0
  - name: json
    buildsystem: cmake
    build-options:
      append-path: /usr/lib/sdk/llvm21/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
    config-opts:
      - -D CMAKE_C_COMPILER=clang
      - -D CMAKE_CXX_COMPILER=clang++
      - -D CMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/nlohmann/json.git
        tag: v3.12.0
        commit: 55f93686c01528224f448c19128836e7df245f72
  - name: ngtcp2
    buildsystem: cmake
    build-options:
      append-path: /usr/lib/sdk/llvm21/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
    config-opts:
      - -D CMAKE_C_COMPILER=clang
      - -D CMAKE_CXX_COMPILER=clang++
      - -D CMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/ngtcp2/ngtcp2.git
        tag: v1.25.0
        commit: f9e9ff01ad2c8116bc09de4f644b0028a61486a6
  - name: nghttp3
    buildsystem: cmake
    build-options:
      append-path: /usr/lib/sdk/llvm21/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
    config-opts:
      - -D CMAKE_C_COMPILER=clang
      - -D CMAKE_CXX_COMPILER=clang++
      - -D CMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/ngtcp2/nghttp3.git
        tag: v1.18.0
        commit: dbfc24286138cb0b6490160e7ca87fe1ce6722a0
  - name: zstd
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/llvm21/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
    config-opts:
      - -D CMAKE_C_COMPILER=clang
      - -D CMAKE_CXX_COMPILER=clang++
      - -D CMAKE_BUILD_TYPE=Release
    build-commands:
      - mkdir build/cmake/builddir
      - cmake -D CMAKE_C_COMPILER=clang -D CMAKE_CXX_COMPILER=clang++ -D CMAKE_BUILD_TYPE=Release -B build/cmake/builddir -S build/cmake/
      - cmake --build build/cmake/builddir --parallel
      - cmake --install build/cmake/builddir --config Release --prefix=/app/
    sources:
      - type: git
        url: https://github.com/facebook/zstd
        tag: v1.5.7
        commit: f8745da6ff1ad1e7bab384bd1f9d742439278e99
  - name: miniz
    buildsystem: cmake
    build-options:
      append-path: /usr/lib/sdk/llvm21/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
    config-opts:
      - -D CMAKE_C_COMPILER=clang
      - -D CMAKE_CXX_COMPILER=clang++
      - -D CMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/richgel999/miniz
        tag: 3.1.2
        commit: 77d0dce8627735138c51770d1799a1ef48f2117d
  - name: ymir
    buildsystem: cmake-ninja
    build-options:
      append-path: /usr/lib/sdk/llvm21/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
    config-opts:
      - -D CMAKE_C_COMPILER=clang
      - -D CMAKE_CXX_COMPILER=clang++
      - -D CMAKE_BUILD_TYPE=Release
      - -D Ymir_EXTRA_INLINING=ON
      - -D Ymir_ENABLE_SANDBOX=OFF
      - -D Ymir_ENABLE_IPO=ON
      - -D Ymir_ENABLE_DEVLOG=OFF
      - -D Ymir_ENABLE_IMGUI_DEMO=OFF
      - -D Ymir_DEV_BUILD=OFF
      - -D Ymir_ENABLE_UPDATE_CHECKS=OFF
      - -D Ymir_ENABLE_YMDASM=OFF
    post-install:
      - desktop-file-edit apps/ymir-sdl3/res/io.github.strikerx3.ymir.desktop --set-key=Exec --set-value="ymir-sdl3 --user"
      - install -Dm755 apps/ymir-sdl3/ymir-sdl3 ${FLATPAK_DEST}/bin/ymir-sdl3
      - install -Dm644 apps/ymir-sdl3/res/io.github.strikerx3.ymir.xml ${FLATPAK_DEST}/share/metainfo/io.github.strikerx3.ymir.metainfo.xml
      - install -Dm644 apps/ymir-sdl3/res/io.github.strikerx3.ymir.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 apps/ymir-sdl3/res/ymir.png -t ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps
    cleanup:
      - /lib/cmake
      - /lib/pkgconfig
      - /include
      - /bin/curl-config
      - /bin/wcurl
      - /bin/curl
      - /share/Catch2
      - /share/tomlplusplus
      - /share/rtmidi
      - /share/man
      - /share/doc
      - /share/cmake
      - /include/
    sources:
      - type: git
        url: https://github.com/StrikerX3/Ymir.git
        tag: v0.4.1
        commit: d49c0868cf9998d279394498ad0cd0efbd102ccb
        x-checker-data:
          type: json
          url: https://api.github.com/repos/StrikerX3/ymir/releases/latest
          version-query: .tag_name | sub("^v"; "")
          tag-query: .tag_name
          timestamp-query: .published_at
      - type: patch
        path: io.github.strikerx3.ymir.xml.patch
